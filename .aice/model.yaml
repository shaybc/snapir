# a-ice model — objects and connections. Layout lives in diagrams/, flows in flows/.
version: 1
name: Snapir conversion
tagGroups: []
objects:
  - id: operator
    type: actor
    name: Migration operator
    description: Selects operations, approves gates, and resumes migration runs.
  - id: snapir
    type: system
    name: Snapir conversion
    description: Converts Composer behavior into reviewed Java services.
  - id: conversion-cli
    type: app
    name: Conversion CLI
    description: Coordinates intake, preparation, gated conversion, and final deliverables.
    parent: snapir
    technologies:
      - Python
    code:
      - source/workspace_intake.py
      - source/runtime/**
  - id: intake
    type: component
    name: 1. Intake and analyze
    description: Builds selected inventory through indexed map-first or legacy discovery paths.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/pipeline_runner.py
      - source/runtime/indexed_intake.py
      - source/tools/component_inventory_tools/**
      - source/tools/composer_mapper_tools/**
  - id: intake-control
    type: component
    name: Intake routing
    description: Selects indexed map-first or legacy discovery intake and manages the run lifecycle.
    parent: intake
    technologies:
      - Python
    code:
      - source/runtime/pipeline_runner.py
      - source/runtime/indexed_intake.py
  - id: source-discovery
    type: component
    name: Source and classpath discovery
    description: Resolves Java sources, project classpaths, and legacy workspace inventory facts.
    parent: intake
    technologies:
      - Python
    code:
      - source/tools/source_discovery_tools/**
      - source/tools/state_store_tools/workspace_analysis.py
  - id: analyzer
    type: component
    name: Composer analyzer
    description: Validates mapped evidence, selects inventory, imports definitions, and records source changes.
    parent: intake
    technologies:
      - Python
    code:
      - source/agents/legacy_composer_analysis/**
      - source/tools/composer_mapper_tools/**
      - source/tools/component_inventory_tools/**
  - id: map-validation
    type: component
    name: Map validation and source freshness
    description: Checks existing vault structure and indexed map publication and source fingerprints.
    parent: analyzer
    technologies:
      - Python
    code:
      - source/tools/composer_mapper_tools/indexed_analysis.py
      - source/tools/workspace_intake_tools/vault_validator.py
      - source/tools/state_store_tools/map_snapshot.py
  - id: selected-inventory
    type: component
    name: Selected inventory and dependency closure
    description: Builds the selected component inventory and pins its source analysis revision.
    parent: analyzer
    technologies:
      - Python
    code:
      - source/tools/component_inventory_tools/**
      - source/tools/state_store_tools/component_inventory.py
  - id: vault-import
    type: component
    name: Composer definition import
    description: Imports indexed, scoped, or legacy definitions into run state.
    parent: analyzer
    technologies:
      - Python
    code:
      - source/tools/composer_mapper_tools/vault_importer.py
      - source/tools/composer_mapper_tools/indexed_vault_importer.py
      - source/tools/composer_mapper_tools/scoped_vault_importer.py
  - id: analysis-invalidation
    type: component
    name: Change tracking and invalidation
    description: Records analysis summaries and invalidates affected work when source hashes change.
    parent: analyzer
    technologies:
      - Python
    code:
      - source/agents/legacy_composer_analysis/agent.py
      - source/tools/state_store_tools/invalidation.py
  - id: preparation
    type: component
    name: 2. Prepare qualified evidence
    description: Resolves operation evidence, dependencies, routes, and scoped generation readiness.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/scoped_conversion.py
      - source/tools/conversion_tools/scoped_workflow/**
      - source/tools/conversion_tools/scoped_reuse/**
  - id: scoped-native
    type: component
    name: Scoped native execution
    description: Enforces preparation mode and approved native capabilities before conversion.
    parent: preparation
    technologies:
      - Python
    code:
      - source/runtime/scoped_native/**
  - id: prepared-closure
    type: component
    name: Qualified operation closure
    description: Resolves exact operation dependencies, source projects, and original source evidence.
    parent: preparation
    technologies:
      - Python
    code:
      - source/tools/conversion_tools/closure_builder_tool.py
      - source/tools/conversion_tools/scoped_workflow/preparation.py
      - source/tools/conversion_tools/scoped_workflow/source_project.py
  - id: prepared-contracts
    type: component
    name: Contracts and operation calls
    description: Plans context contracts and binds calls to local or published operation boundaries.
    parent: preparation
    technologies:
      - Python
    code:
      - source/tools/conversion_tools/scoped_workflow/contracts.py
      - source/tools/conversion_tools/scoped_workflow/calls.py
  - id: prepared-units
    type: component
    name: Configured units and evidence
    description: Builds configured units, bindings, and complete operation request payloads.
    parent: preparation
    technologies:
      - Python
    code:
      - source/tools/conversion_tools/scoped_workflow/units.py
      - source/tools/conversion_tools/scoped_workflow/unit_evidence.py
      - source/tools/conversion_tools/scoped_workflow/payloads.py
  - id: preparation-reuse
    type: component
    name: Preparation freshness and reuse
    description: Checks evidence fingerprints and reuses only eligible prepared checkpoints.
    parent: preparation
    technologies:
      - Python
    code:
      - source/tools/conversion_tools/scoped_reuse/**
  - id: planning
    type: component
    name: 3. Plan dependencies
    description: Builds dependency-ordered operation plans for selected migration work.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/planning.py
      - source/runtime/intake_plan.py
      - source/agents/migration_planning/**
  - id: dependency-order
    type: component
    name: Dependency ordering
    description: Finds operation dependencies, blocks unresolved cycles, and builds execution waves.
    parent: planning
    technologies:
      - Python
    code:
      - source/tools/operation_call_tools/preflight.py
      - source/tools/operation_call_tools/ordering.py
      - source/runtime/intake_plan.py
  - id: plan-generation
    type: component
    name: Migration plan construction
    description: Constructs operation batches and task packets from selected planning inputs.
    parent: planning
    technologies:
      - Python
    code:
      - source/runtime/planning.py
      - source/agents/migration_planning/agent.py
  - id: plan-validation
    type: component
    name: Plan validation and persistence
    description: Validates run ownership, operation coverage, and batch ordering before saving the plan.
    parent: planning
    technologies:
      - Python
    code:
      - source/agents/migration_planning/plan_validator.py
      - source/agents/migration_planning/agent.py
      - source/runtime/planning.py
  - id: services
    type: component
    name: 5. Create and validate services
    description: Wraps approved operation sources in validated executable Java service projects.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/service_generation/**
  - id: service-wrappers
    type: component
    name: Service wrappers and wiring
    description: Generates service wrappers around immutable approved operation sources.
    parent: services
    technologies:
      - Python
    code:
      - source/runtime/service_generation/runner.py
      - source/runtime/service_generation/project_output.py
      - source/runtime/service_generation/operation_wiring.py
      - source/runtime/service_generation/connection_wiring.py
  - id: service-build
    type: component
    name: Service build and tests
    description: Compiles, tests, packages, and checks final service projects.
    parent: services
    technologies:
      - Python
    code:
      - source/runtime/service_generation/validation.py
      - source/runtime/service_generation/runner.py
  - id: service-packaging
    type: component
    name: Executable and deployment artifacts
    description: Builds executable project structure and renders configured deployment artifacts.
    parent: services
    technologies:
      - Python
    code:
      - source/runtime/service_generation/microservice_output.py
      - source/runtime/service_generation/maven_reactor.py
      - source/runtime/service_generation/packaging_policy.py
      - source/runtime/service_generation/helm_render_checks.py
  - id: finalization
    type: component
    name: 6. Finalize deliverables
    description: Verifies deliverable evidence and produces reports and deployment manifests without deployment.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/finalization/**
      - source/tools/deployment_tools/**
  - id: final-evidence
    type: component
    name: Final evidence freshness
    description: Checks accepted operation evidence, project fingerprints, and required prior approvals.
    parent: finalization
    technologies:
      - Python
    code:
      - source/runtime/finalization/runner.py
      - source/runtime/operation_review/evidence.py
  - id: final-artifacts
    type: component
    name: Documentation and manifests
    description: Creates operation documentation and deployment deliverables.
    parent: finalization
    technologies:
      - Python
    code:
      - source/agents/documentation_report/**
      - source/agents/java_deployment_manifest/**
      - source/tools/deployment_tools/**
  - id: final-approval
    type: component
    name: Final report and Gate 5
    description: Collects final validation evidence and records migration approval without deployment.
    parent: finalization
    technologies:
      - Python
    code:
      - source/runtime/finalization/runner.py
  - id: conversion-stage
    type: component
    name: 4. Convert and assemble
    description: Converts reusable components and behavior units into reviewed operation implementations.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/runner.py
      - source/runtime/component_conversion/**
      - source/runtime/managed_projects.py
  - id: components
    type: component
    name: Component-first conversion
    description: Converts reusable basic components when component-first mode is selected.
    parent: conversion-stage
    technologies:
      - Python
    code:
      - source/runtime/component_conversion/**
  - id: behavior-runner
    type: component
    name: Behavior conversion and assembly
    description: Converts dependency-ordered units and assembles reviewed operation implementations.
    parent: conversion-stage
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/runner.py
      - source/runtime/behavior_conversion/operation_calls.py
      - source/runtime/behavior_conversion/review.py
      - source/runtime/behavior_conversion/revisions.py
  - id: unit-conversion
    type: component
    name: Unit conversion and acceptance
    description: Converts units in dependency order and accepts only validated reviewed bundles.
    parent: behavior-runner
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/runner.py
      - source/runtime/behavior_conversion/revisions.py
      - source/runtime/behavior_conversion/bundle_output.py
  - id: operation-composition
    type: component
    name: Operation assembly and review
    description: Assembles accepted units into operation implementations and reviews them before service generation.
    parent: behavior-runner
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/runner.py
      - source/runtime/behavior_conversion/operation_calls.py
      - source/runtime/behavior_conversion/review.py
  - id: managed-conversion
    type: component
    name: Managed source conversion
    description: Converts source tasks through the existing managed project workflow.
    parent: conversion-stage
    technologies:
      - Python
    code:
      - source/runtime/managed_projects.py
      - source/runtime/component_review/**
      - source/runtime/operation_assembly/**
      - source/runtime/operation_review/**
  - id: generation
    type: component
    name: Bounded generation
    description: Validates structured model responses and retains bounded attempts and correction feedback.
    parent: conversion-stage
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/generation.py
      - source/runtime/behavior_conversion/compatibility.py
      - source/runtime/behavior_conversion/resume_budget.py
  - id: staged-generation
    type: component
    name: Staged conversion
    description: Separates implementation, compile checks, metadata, bindings, and test generation.
    parent: generation
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/staged_pipeline.py
      - source/runtime/behavior_conversion/staged_conversion.py
      - source/runtime/behavior_conversion/stage_tasks.py
  - id: production-stage
    type: component
    name: Production implementation
    description: Generates production Java against original evidence and typed boundary contracts.
    parent: staged-generation
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/staged_pipeline.py
      - source/runtime/behavior_conversion/staged_conversion.py
      - source/runtime/behavior_conversion/typed_boundaries.py
  - id: metadata-stage
    type: component
    name: API metadata and bindings
    description: Inspects native APIs and resolves dependencies, mappings, and verification bindings.
    parent: staged-generation
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/native_metadata.py
      - source/runtime/behavior_conversion/native_binding_builder.py
      - source/runtime/behavior_conversion/staged_adapters.py
  - id: tests-stage
    type: component
    name: Tests and staged acceptance
    description: Generates focused tests and submits the assembled result to the owning acceptance validator.
    parent: staged-generation
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/staged_pipeline.py
      - source/runtime/behavior_conversion/staged_conversion.py
      - source/runtime/behavior_conversion/stage_tasks.py
  - id: side-road
    type: component
    name: Optional side-road recovery
    description: Checks an isolated baseline and simplification after eligible framework-dependency failures.
    parent: generation
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/side_road_conversion.py
      - source/runtime/behavior_conversion/side_road_policy.py
  - id: workflow-support
    type: component
    name: Workflow controls and shared capabilities
    description: Provides resume coordination, approvals, model access, and validation across stages.
    parent: conversion-cli
    technologies:
      - Python
    code:
      - source/runtime/checkpoints.py
      - source/runtime/operation_coordinator.py
      - source/runtime/human_gates.py
      - source/runtime/model_execution/**
  - id: checkpoints
    type: component
    name: Resume and checkpoints
    description: Restores persisted phases and routes work through current preparation and acceptance checks.
    parent: workflow-support
    technologies:
      - Python
    code:
      - source/runtime/checkpoints.py
      - source/runtime/migration_start.py
      - source/runtime/gate_numbering.py
  - id: coordinator
    type: component
    name: Operation coordinator
    description: Runs selected operations with scoped gates and verified dependency publication.
    parent: workflow-support
    technologies:
      - Python
    code:
      - source/runtime/operation_coordinator.py
      - source/runtime/service_publication.py
  - id: verification
    type: component
    name: Build and behavior validation
    description: Checks native bundles, typed boundaries, builds, tests, and applicable behavioral evidence.
    parent: workflow-support
    technologies:
      - Python
    code:
      - source/runtime/behavior_conversion/bundle_output.py
      - source/runtime/behavior_conversion/stage_compilation.py
      - source/runtime/behavior_conversion/verification_ladder.py
      - source/tools/behavior_verification/**
      - source/runtime/runtime_validation/**
  - id: model-executor
    type: component
    name: Model execution
    description: Calls the configured model with readiness checks, timeouts, and transport retries.
    parent: workflow-support
    technologies:
      - Python
    code:
      - source/runtime/model_execution/**
  - id: gates
    type: component
    name: Approval gates
    description: Binds approval decisions to exact reports and blocks failed checks.
    parent: workflow-support
    technologies:
      - Python
    code:
      - source/runtime/human_gates.py
      - source/runtime/scoped_native/plan_approval.py
      - source/runtime/service_generation/gate.py
  - id: composer-mapper
    type: app
    name: Composer Mapper
    description: Indexes Composer definitions and Java evidence into a reusable map.
    parent: snapir
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/**
  - id: mapper-entry
    type: component
    name: Mapper mode selection
    description: Chooses indexed analysis, scoped vault generation, or legacy vault generation.
    parent: composer-mapper
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/Main.java
  - id: mapper-discovery
    type: component
    name: Composer file discovery
    description: Discovers source files and channel selection for mapping.
    parent: composer-mapper
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/service/FileDiscoveryService.java
  - id: mapper-index
    type: component
    name: Definition and source indexing
    description: Indexes source definitions and Java declarations for map generation.
    parent: composer-mapper
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/index/**
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/service/ScopedDefinitionCatalog.java
  - id: mapper-xml-index
    type: component
    name: XML and channel definitions
    description: Indexes Composer XML definitions and channel mapping.
    parent: mapper-index
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/index/XmlDefinitionIndexer.java
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/index/IniMappingIndexer.java
  - id: mapper-java-index
    type: component
    name: Java declaration index
    description: Indexes Java class ownership and declarations.
    parent: mapper-index
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/index/JavaClassIndexer.java
  - id: mapper-analysis
    type: component
    name: Reusable indexed analysis
    description: Persists indexed facts and supports fingerprint-based reuse and recovery.
    parent: composer-mapper
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/storage/**
  - id: mapper-vault
    type: component
    name: Vault generation
    description: Writes qualified scoped evidence or legacy Markdown notes and manifests.
    parent: composer-mapper
    technologies:
      - Java
    code:
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/service/ScopedVaultGenerationService.java
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/service/StreamingGenerationService.java
      - source/composer-mapper/src/main/java/il/co/dcd/composermapper/render/**
  - id: verification-java
    type: app
    name: Java behavior verification tool
    description: Resolves source-backed inherited and delegated format lifecycles and compares original behavior with independent native APIs.
    parent: snapir
    technologies:
      - Java
    code:
      - source/behavior-verification-java/src/**
  - id: run-state
    type: store
    name: Run state
    description: Persists selected inventory, plans, attempts, approvals, and acceptance evidence.
    parent: snapir
    technologies:
      - SQLite
  - id: composer-map
    type: store
    name: Reusable Composer map
    description: Holds indexed analysis and scoped or legacy vault evidence.
    parent: snapir
    technologies:
      - SQLite
      - Markdown
  - id: workspace-cache
    type: store
    name: Workspace analysis cache
    description: Reuses fingerprinted workspace facts for legacy inventory analysis.
    parent: snapir
    technologies:
      - SQLite
  - id: deliverables
    type: store
    name: Generated projects and reports
    description: Holds generated Java projects, build receipts, reports, and deployment artifacts.
    parent: snapir
    technologies:
      - Filesystem
  - id: legacy-workspace
    type: system
    name: Legacy Composer workspace
    description: Provides original XML configuration, Java implementations, and classpath dependencies.
    external: true
  - id: model-provider
    type: system
    name: Configured model provider
    description: Generates structured conversion results and reviews through Gemini or a compatible endpoint.
    external: true
connections:
  - id: operator-intake
    from: operator
    to: intake-control
    description: Starts a selected migration run
    technology: CLI
  - id: operator-resume
    from: operator
    to: checkpoints
    description: Resumes a persisted migration run
    technology: CLI
  - id: operator-gates
    from: operator
    to: gates
    description: Records explicit approval or rejection
    technology: CLI
  - id: intake-source
    from: source-discovery
    to: legacy-workspace
    description: Discovers sources, classpath, and source fingerprints
    technology: Filesystem
  - id: intake-mapper
    from: intake-control
    to: mapper-entry
    description: Runs mapping unless an existing map is supplied
    technology: Java subprocess
  - id: mapper-source
    from: mapper-discovery
    to: legacy-workspace
    description: Reads Composer definitions and Java sources
    technology: Filesystem
  - id: mapper-map
    from: mapper-vault
    to: composer-map
    description: Publishes indexed analysis and vault evidence
    technology: SQLite / Filesystem
  - id: intake-map
    from: map-validation
    to: composer-map
    description: Validates and imports selected map evidence
    technology: SQLite / Filesystem
  - id: intake-cache
    from: source-discovery
    to: workspace-cache
    description: Reuses fingerprinted facts in legacy analysis
    technology: SQLite
  - id: intake-state
    from: vault-import
    to: run-state
    description: Persists pinned selection and inventory
    technology: SQLite
  - id: intake-plan
    from: intake-control
    to: plan-generation
    description: Prepares planning inputs on eligible legacy paths
    technology: function call
  - id: resume-state
    from: checkpoints
    to: run-state
    description: Loads persisted configuration and current phase
    technology: SQLite
  - id: resume-coordinator
    from: checkpoints
    to: coordinator
    description: Continues selected operation execution
    technology: function call
  - id: coordinator-planning
    from: coordinator
    to: planning
    description: Resumes the approved dependency plan
    technology: function call
  - id: coordinator-behavior
    from: coordinator
    to: behavior-runner
    description: Runs the selected behavior-unit workflow
    technology: function call
  - id: resume-managed
    from: checkpoints
    to: managed-conversion
    description: Resumes applicable managed conversion phases
    technology: function call
  - id: behavior-scoped
    from: behavior-runner
    to: scoped-native
    description: Routes scoped runs to qualified native execution
    technology: function call
  - id: scoped-preparation
    from: scoped-native
    to: preparation
    description: Prepares selected evidence before any generation
    technology: function call
  - id: preparation-map
    from: prepared-closure
    to: composer-map
    description: Resolves and checks pinned source-linked evidence
    technology: Filesystem / SQLite
  - id: preparation-source
    from: preparation-reuse
    to: legacy-workspace
    description: Checks current original source evidence
    technology: Filesystem
  - id: preparation-state
    from: preparation-reuse
    to: run-state
    description: Validates reusable preparation checkpoints
    technology: SQLite
  - id: scoped-plan
    from: scoped-native
    to: plan-generation
    description: Resolves an execution plan for prepared operations
    technology: function call
  - id: planning-state
    from: plan-validation
    to: run-state
    description: Persists and restores dependency-ordered plans
    technology: SQLite
  - id: scoped-gates
    from: scoped-native
    to: gates
    description: Requires plan approval and Gate 1 before generation
    technology: function call
  - id: scoped-components
    from: scoped-native
    to: components
    description: Converts basic components only in component-first mode
    technology: function call
  - id: scoped-behavior
    from: scoped-native
    to: unit-conversion
    description: Converts qualified units after readiness and approval
    technology: function call
  - id: components-generation
    from: components
    to: generation
    description: Requests scoped component implementations
    technology: function call
  - id: behavior-generation
    from: unit-conversion
    to: generation
    description: Requests unit and operation bundles with original evidence
    technology: function call
  - id: generation-staged
    from: generation
    to: staged-generation
    description: Routes registered code tasks through staging when enabled
    technology: function call
  - id: staged-model
    from: production-stage
    to: model-executor
    description: Requests narrow implementation, metadata, and test results
    technology: function call
  - id: generation-model
    from: generation
    to: model-executor
    description: Requests structured generation or review results
    technology: function call
  - id: model-provider-call
    from: model-executor
    to: model-provider
    description: Submits bounded model requests
    technology: HTTPS / ADK
  - id: staged-verification
    from: production-stage
    to: verification
    description: Compiles production and validates staged results
    technology: function call
  - id: generation-verification
    from: generation
    to: verification
    description: Validates candidates before acceptance
    technology: function call
  - id: verification-java-call
    from: verification
    to: verification-java
    description: Inspects APIs and compares executable behavior when applicable
    technology: Java subprocess
  - id: verification-deliverables
    from: verification
    to: deliverables
    description: Writes build, test, and comparison evidence
    technology: Filesystem
  - id: generation-state
    from: generation
    to: run-state
    description: Retains attempts, compatibility fingerprints, and accepted results
    technology: SQLite
  - id: staged-state
    from: tests-stage
    to: run-state
    description: Retains stage revisions, feedback, and readiness
    technology: SQLite
  - id: generation-recovery
    from: generation
    to: side-road
    description: Recovers eligible failures only when side-road mode is enabled
    technology: function call
  - id: recovery-generation
    from: side-road
