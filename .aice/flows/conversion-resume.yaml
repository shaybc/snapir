id: conversion-resume
name: Resume and evidence reuse
description: Resume rechecks preparation and task compatibility rather than treating saved results as unconditional
  acceptance.
diagram: scope-conversion-cli
steps:
- connection: operator-resume
  description: Resume the selected persisted run.
- connection: resume-state
  description: Read current phase and persisted configuration; reject ambiguous approvals from the previous Gate
    4/5 numbering.
- connection: resume-coordinator
  description: Continue the applicable operation workflow.
- connection: coordinator-planning
  description: Load the dependency plan and its operation scope.
- connection: coordinator-behavior
  description: Resume behavior-unit execution for the selected operation.
- connection: behavior-scoped
  description: Use scoped native execution for scoped runs.
- connection: scoped-preparation
  description: Reprepare qualified contexts from pinned evidence.
- connection: preparation-map
  description: Check reusable map evidence and checkpoint freshness.
- connection: preparation-source
  description: Check current source evidence; stale contexts block conversion.
- connection: preparation-state
  description: Validate stored preparation checkpoints against current evidence.
- connection: scoped-gates
  description: Recheck report-bound approval decisions.
- connection: scoped-behavior
  description: Continue only when the selected native mode and prepared contexts allow it.
- connection: behavior-generation
  description: Resume the owning generation task.
- connection: generation-state
  description: Check task compatibility and remaining durable attempt budgets before reuse.
- connection: staged-state
  description: Reuse eligible stage revisions and invalidate readiness when production changes.
- connection: generation-verification
  description: Apply current acceptance checks to resumed candidates.
- connection: publication-output
  description: Verify publication artifacts before dependent operations consume them.
