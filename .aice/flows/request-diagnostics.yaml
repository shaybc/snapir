id: request-diagnostics
name: Oversized request capture and export
description: Captures and exports oversized request evidence.
diagram: request-diagnostics
steps:
- connection: model-diagnostic-scope
  description: Bind captures to the active run while model diagnostics are attached.
- connection: generation-request-budget
  description: Measure application JSON and instructions against the configured character budget, including after
    correction compaction when applicable.
- connection: request-capture-output
  description: Save oversized requests as not sent at the named budget-check stage, excluding provider transport
    settings.
- connection: operator-diagnostics
  description: Select the saved run through the diagnostics CLI.
- connection: diagnostics-state
  description: Inspect saved migration state read-only.
- connection: diagnostics-captures
  description: Read exact saved captures without reconstructing historical requests or reading original workspace
    sources.
- connection: diagnostics-export
  description: Export the stage-specific HTML dashboard, text/JSON summaries and captured materials with source naming
    and occurrence manifests. During AI conversion, skip the legacy export fall-through.
details: 'Retains application request/response evidence during an active run and later exports it by conversion target.


  Capture happens inside an active run diagnostic scope, including oversized budget checks and correlated generation,
  delivery and validation events. Later export is a separate operator action; the CLI selects the saved stage and
  correlates stored evidence while preserving source naming and occurrence provenance. Missing historical evidence
  and HTTP status remain explicit. No request reconstruction or original-source reading is performed by export.'
narration:
  intro: During conversion, a request can be too large to send or return unusable content. This flow shows how
    saved request, response and validation evidence can explain what happened to each conversion target.
  s:0: Run diagnostics binds capture to the current run. Requests, responses and correlated attempt events can
    be saved there without changing retries or conversion acceptance.
  s:1: The shared check counts the request's JSON data and instructions and compares the total with the character
    limit. It measures again after correction text is shortened when that path is used.
  s:2: If the request is too large, the capture can save the request, instructions, and size report before submission.
    It records the budget-check stage and leaves out provider transport settings.
  s:3: Later, the operator selects the saved run in Saved run diagnostics CLI. Reading that run does not start a
    new conversion attempt.
  s:4: The tool opens the database read-only and selects the saved workflow stage. During conversion it correlates
    target histories instead of rerunning an earlier boundary investigation.
  s:5: Saved attempts, results, captured materials and labelled log evidence distinguish budget checks, delivery,
    JSON failures and validation. Missing HTTP status or historical instructions are not guessed.
  s:6: The tool exports an offline HTML dashboard with the shared stage checklist and filtered conversion histories.
    The operator can follow dependencies, inspect retries and open captured materials without rerunning earlier investigations.
  outro: Open the local dashboard for a compact overview and drill into component failures or saved indexing evidence.
    Text and JSON summaries remain available, and missing historical evidence stays explicit.
