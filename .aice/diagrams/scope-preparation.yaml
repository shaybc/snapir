id: scope-preparation
name: L4 - Qualified evidence preparation
scope: preparation
objects:
- scoped-native
- prepared-closure
- prepared-contracts
- prepared-units
- preparation-reuse
- framework-boundaries
layout:
  scoped-native:
    x: 0
    y: 130
  prepared-closure:
    x: 440
    y: 0
  prepared-contracts:
    x: 880
    y: 0
  prepared-units:
    x: 1320
    y: 0
  preparation-reuse:
    x: 440
