# Common settings default to ../configs/default_config.yaml; tool defaults normally suffice.
# Explicit local shared fields override common values, including null and empty collections.
# null: use SNAPIR_COMMON_CONFIG or the default common file (CLI --common-config wins).
# A relative path here is resolved against this tool YAML.
common_config_path: ../configs/default_config.yaml
source_encoding: UTF-8         # Encoding of original/decompiled Java files, e.g. windows-1255
# The default command uses this Python interpreter and ../java-policy-validator/run.py.
validator_policy_path: ../java-policy-validator/policy.json
validator_timeout_seconds: 900
comparison_config_path: ../java-behavior-comparator/config.yaml
comparison_timeout_seconds: 4200
# comparison_command: [python, 'C:/tools/java-behavior-comparator/run.py']
# validator_command: [python, 'C:/tools/java-policy-validator/run.py']
model_stream: false            # Enable only if the organization endpoint supports streaming

# Settings specific to this separate tool.
output_root: ./work
approved_library_root: ./approved
native_package: il.co.dbank
request_character_limit: 2700000
format_base_class: com.ibm.dse.base.FormatElement
decorator_base_classes:
  - com.ibm.dse.base.FormatDecorator
  - com.ibm.il.dse.cc.decorator.FormatDecoratorHolder
source_excludes: [".git", ".venv", "target", "bin", "build", "node_modules"]
# Dependency versions are supplied to the AI as approved choices, not installed by this tool.
known_dependencies: []
